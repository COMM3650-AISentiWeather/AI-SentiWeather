name: AI Sentiweather
on:
  schedule:
    # Primary at 08:00 HKT, plus fallbacks away from the busy start of the hour.
    # A current complete public snapshot makes subsequent scheduled runs no-ops.
    - cron: '0 0 * * *'
    - cron: '17 0 * * *'
    - cron: '37 0 * * *'
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        description: Collect and publish, rebuild from saved data, or backfill
        options:
          - update
          - rebuild
          - backfill
          - restore
        default: update
      sources:
        type: string
        description: Comma-separated subset (nyt,guardian,bbc,hacker_news,reddit,bluesky). Empty runs all.
        default: ''
      reset_to:
        type: string
        description: For operation=restore, the ISO instant to pin source watermarks to.
        default: ''
concurrency:
  group: atlas-production
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: true
      - name: Check whether today's snapshot is already complete
        id: freshness
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: python scripts/schedule_guard.py
      - name: Verify private data settings
        if: steps.freshness.outputs.needed == 'true'
        env:
          DATA_REPO: ${{ vars.DATA_REPO }}
          DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          test -n "$DATA_REPO" && test -n "$DATA_TOKEN" || { echo "Configure DATA_REPO and DATA_REPO_TOKEN first"; exit 1; }
          test "$(gh api "repos/$DATA_REPO" --jq '.private')" = true || { echo 'Data repository must be private'; exit 1; }
      - uses: actions/checkout@v6
        if: steps.freshness.outputs.needed == 'true'
        with:
          repository: ${{ vars.DATA_REPO }}
          ref: main
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: private-data
      - uses: actions/setup-python@v6
        if: steps.freshness.outputs.needed == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
        if: steps.freshness.outputs.needed == 'true'
      - run: python -m unittest discover -s tests
        if: steps.freshness.outputs.needed == 'true'
      - name: Check backfill preparation
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'backfill'
        run: python scripts/backfill_reset.py
      - name: Pin watermarks to a timestamp
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'restore'
        env:
          RESET_TO: ${{ inputs.reset_to }}
        run: python scripts/backfill_reset.py --to "$RESET_TO" --force
      - name: Collect sources
        id: collect
        if: steps.freshness.outputs.needed == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.operation == 'update' || inputs.operation == 'backfill')))
        timeout-minutes: 245
        continue-on-error: true
        env:
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          MEDIACLOUD_API_KEY: ${{ secrets.MEDIACLOUD_API_KEY }}
          OBS_SOURCES: ${{ inputs.sources }}
          OBS_BACKFILL: ${{ inputs.operation == 'backfill' && '1' || '' }}
        run: python -u scripts/collect.py
      - name: Persist private checkpoints
        if: steps.collect.outcome == 'success' || steps.collect.outcome == 'failure' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'restore')
        working-directory: private-data
        run: |
          git config user.name "AI Sentiweather"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- . ':!scratch'
          if ! git diff --cached --quiet; then
            git commit -m "Save collection checkpoint for run ${GITHUB_RUN_ID}"
            git push origin HEAD:main
          fi
      - name: Build and check public snapshot
        if: steps.freshness.outputs.needed == 'true' && inputs.operation != 'backfill' && inputs.operation != 'restore'
        env:
          OBS_OUTPUT: docs
        run: |
          python scripts/build.py
          python -c "import json; d=json.load(open('docs/dashboard.json')); assert d['ranges'], 'No verified source windows yet; run update or import checkpoints'"
      - name: Publish the rebuilt site to docs/
        if: steps.freshness.outputs.needed == 'true' && inputs.operation != 'backfill' && inputs.operation != 'restore'
        run: |
          git config user.name "AI Sentiweather"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "Publish ${GITHUB_RUN_ID}"
            git push origin HEAD:main
          fi
      - name: Flag incomplete collection
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::One or more collectors were incomplete. Check the source status, fix the cause and run update again."
          exit 1
