name: AI SentiWeather
on:
  schedule:
    # 00:00 UTC = 08:00 HKT. Each run collects the window ending 07:55 HKT the
    # same morning, so the five minutes between the cutoff and the trigger keep
    # a run from ever falling back to yesterday's window.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        description: Collect and publish, rebuild from saved data, or backfill
        options:
          - update
          - rebuild
          - backfill
        default: update
      sources:
        type: string
        description: Comma-separated subset (nyt,guardian,bbc,hacker_news,reddit,bluesky). Empty runs all.
        default: ''
concurrency:
  group: atlas-production
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify private data settings
        env:
          DATA_REPO: ${{ vars.DATA_REPO }}
          DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          test -n "$DATA_REPO" && test -n "$DATA_TOKEN" || { echo "Configure DATA_REPO and DATA_REPO_TOKEN first"; exit 1; }
          test "$(gh api "repos/$DATA_REPO" --jq '.private')" = true || { echo 'Data repository must be private'; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.DATA_REPO }}
          ref: main
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: private-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Reset watermarks for a backfill
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'backfill'
        run: python scripts/backfill_reset.py
      - name: Collect sources
        id: collect
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.operation == 'update' || inputs.operation == 'backfill'))
        timeout-minutes: 245
        continue-on-error: true
        env:
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          MEDIACLOUD_API_KEY: ${{ secrets.MEDIACLOUD_API_KEY }}
          OBS_SOURCES: ${{ inputs.sources }}
          OBS_BACKFILL: ${{ inputs.operation == 'backfill' && '1' || '' }}
        run: python scripts/collect.py
      - name: Persist private checkpoints
        if: steps.collect.outcome == 'success' || steps.collect.outcome == 'failure'
        working-directory: private-data
        run: |
          git config user.name "AI SentiWeather"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- . ':!scratch'
          if ! git diff --cached --quiet; then
            git commit -m "Save collection checkpoint for run ${GITHUB_RUN_ID}"
            git push origin HEAD:main
          fi
      - name: Build and check public snapshot
        if: inputs.operation != 'backfill'
        env:
          OBS_OUTPUT: docs
        run: |
          python scripts/build.py
          python -c "import json; d=json.load(open('docs/dashboard.json')); assert d['ranges'], 'No verified source windows yet; run update or import checkpoints'"
      - name: Publish the rebuilt site to docs/
        if: inputs.operation != 'backfill'
        run: |
          git config user.name "AI SentiWeather"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "Publish ${GITHUB_RUN_ID}"
            git push origin HEAD:main
          fi
      - name: Flag incomplete collection
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::One or more collectors were incomplete. Check the source status, fix the cause and run update again."
          exit 1
