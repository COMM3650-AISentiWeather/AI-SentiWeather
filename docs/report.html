<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f7f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#050d12" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>Report · AI SentiWeather</title>
<meta name="description" content="Coverage volume, sentiment and quotes for the selected platform and company.">
<script>
  document.documentElement.classList.add("js-anim");
  setTimeout(function () {
    document.querySelectorAll("[data-reveal]").forEach(function (el) { el.classList.add("is-in"); });
  }, 2500);
</script>
<link rel="stylesheet" href="./style.css?v=20261127i">
<script defer src="./plotly.min.js"></script>
<script defer src="./app.js?v=20261127i"></script>
</head>
<body data-page="report">

<div class="aurora" aria-hidden="true"><span class="orb orb-a"></span><span class="orb orb-b"></span><span class="orb orb-c"></span></div>

<header class="site-head">
  <a class="brand" href="./index.html"><i aria-hidden="true">∿</i> AI SentiWeather</a>
  <nav aria-label="Main">
    <a href="./index.html">Home</a>
    <a href="start.html">Explore</a>
    <a href="https://github.com/COMM3650-AISentiWeather/AI-SentiWeather" target="_blank" rel="noopener noreferrer">GitHub</a>
  </nav>
</header>

<main class="page">
  <section class="intro" data-reveal data-anim="rise" style="--d:60ms">
    <div class="kicker">Comparison report</div>
    <h1 id="reportTitle">Building the report…</h1>
    <p id="subtitle"></p>
    <p><a class="back" id="editSelection" href="start.html">← Edit selection</a></p>
  </section>

  <div class="toolbar" data-reveal data-anim="fade" style="--d:200ms">
    <details>
      <summary>Visible sections</summary>
      <div class="toggles" id="toggles"></div>
    </details>
    <label>Group by
      <select id="grain"><option>Day</option><option>Week</option><option>Month</option></select>
    </label>
    <label>Content
      <select id="kind">
        <option value="all">All items</option>
        <option value="primary">Posts &amp; articles</option>
        <option value="comment">Comments</option>
      </select>
    </label>
    <div class="exports">
      <button id="pdf" type="button">PDF</button>
      <button id="png" type="button">PNG</button>
      <button id="csv" type="button">CSV</button>
    </div>
  </div>
  <p id="reportNote" class="small" data-reveal data-anim="fade" style="--d:280ms"></p>
  <div id="charts"></div>
  <p id="exportStatus" role="status"></p>
  <p id="loadError" role="alert" hidden></p>
</main>

<footer>
  <span>AI SentiWeather · COMM3650 · Kelly &amp; Fufu</span>
  <span>Hong Kong time · daily cutoff 07:55 HKT</span>
</footer>
</body>
</html>
